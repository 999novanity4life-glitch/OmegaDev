name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain (rokit.toml)
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Roblox type definitions for luau-lsp
        run: curl -sSfLo globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau

      - name: Check template and every game
        run: |
          status=0
          node scripts/omega.mjs check template || status=1
          for game in games/*/; do
            [ -f "$game/default.project.json" ] || continue
            node scripts/omega.mjs check "$(basename "$game")" || status=1
          done
          exit $status

      - name: Control room smoke test
        run: node scripts/test-room.mjs
