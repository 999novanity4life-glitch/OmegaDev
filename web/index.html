<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creator HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <div class="reactor">
      <svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="13.5" fill="none" stroke="rgba(92,225,255,.25)"/>
        <g class="spin"><path d="M15 1.5 A13.5 13.5 0 0 1 28.5 15" fill="none" stroke="#5ce1ff" stroke-width="1.2"/></g>
        <g class="spin rev"><path d="M15 6 A9 9 0 0 1 6 15" fill="none" stroke="#5ce1ff" stroke-width="1" opacity=".7"/></g>
        <circle cx="15" cy="15" r="3" fill="#5ce1ff" style="filter:drop-shadow(0 0 4px #5ce1ff)"/></svg>
    </div>
    <span><b>CREATOR</b>·CORE</span>
  </div>
  <nav id="nav"></nav>
  <div class="status"><div class="clock mono" id="clock">--:--:--</div><div id="sync"><span class="pulse"></span>connecting</div></div>
</header>
<main id="view"></main>
<script src="app.js"></script>
</body>
</html>
