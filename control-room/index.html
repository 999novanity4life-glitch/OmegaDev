<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmegaDev Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
	/* Layout: chrome-railed sidebar on a carbon-fiber field; panels are chamfered plates with neon-orange status seams. */
	:root {
		color-scheme: dark;
		--void: #07080a;          /* deepest background */
		--carbon-a: #121418;      /* carbon weave light thread */
		--carbon-b: #0b0c0f;      /* carbon weave dark thread */
		--plate: #15171c;         /* panel surface */
		--plate-2: #1c1f25;       /* raised / hover surface */
		--seam: #2a2e36;          /* hairline borders */
		--text: #e9ecf1;
		--dim: #8d94a1;
		--chrome-hi: #f4f6f8;
		--chrome-mid: #a7adb6;
		--chrome-lo: #4b5058;
		--neon: #f07a28;          /* Omega orange */
		--neon-hot: #f6a866;
		--neon-glow: rgba(240, 122, 40, 0.5);
		--ok: #3ddc84; --warn: #ffb020; --bad: #ff4d5e;
		--font-display: "Chakra Petch", "Eurostile", "Segoe UI", system-ui, sans-serif;
		--font-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
		--font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
		--chrome: linear-gradient(180deg, var(--chrome-hi) 0%, var(--chrome-mid) 45%, var(--chrome-lo) 52%, var(--chrome-mid) 70%, var(--chrome-hi) 100%);
		--chamfer: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; }
	body {
		margin: 0; color: var(--text); font: 15px/1.5 var(--font-body);
		background-color: var(--void);
		/* Carbon-fiber weave: 7px tows, each lit on one edge and shaded on the other, alternating direction; a faint orange sheen on top. */
		background-image:
			radial-gradient(120% 80% at 70% -10%, rgba(240, 122, 40, 0.07), transparent 60%),
			linear-gradient(rgba(7, 8, 10, 0.35), rgba(7, 8, 10, 0.35)),
			url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14'><defs><linearGradient id='h' x2='0' y2='1'><stop offset='0' stop-color='%23272b32'/><stop offset='.5' stop-color='%23171a1f'/><stop offset='1' stop-color='%230a0b0d'/></linearGradient><linearGradient id='v'><stop offset='0' stop-color='%23272b32'/><stop offset='.5' stop-color='%23171a1f'/><stop offset='1' stop-color='%230a0b0d'/></linearGradient></defs><rect width='7' height='7' fill='url(%23h)'/><rect x='7' y='7' width='7' height='7' fill='url(%23h)'/><rect x='7' width='7' height='7' fill='url(%23v)'/><rect y='7' width='7' height='7' fill='url(%23v)'/></svg>");
		background-size: 100% 100%, 100% 100%, 14px 14px;
		background-attachment: fixed;
	}
	.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100%; }

	/* Sidebar: dark plate with a chrome rail on its edge. */
	nav {
		position: relative; background: linear-gradient(180deg, rgba(21, 23, 28, 0.96), rgba(10, 11, 14, 0.98));
		padding: 18px 14px; display: flex; flex-direction: column; gap: 4px;
	}
	nav::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 2px; background: var(--chrome); opacity: 0.55; }
	.brand { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; padding: 4px 6px; }
	.logo {
		width: 42px; height: 42px; display: grid; place-items: center; flex: none;
		background: var(--chrome); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
	}
	.logo span {
		width: 36px; height: 36px; display: grid; place-items: center; background: #0d0e11;
		clip-path: inherit; font: 700 22px/1 var(--font-display); color: var(--neon);
		text-shadow: 0 0 8px var(--neon-glow), 0 0 18px var(--neon-glow);
	}
	.brand b {
		display: block; font: 700 18px/1.1 var(--font-display); letter-spacing: 0.12em; text-transform: uppercase;
		background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent;
	}
	.brand small { color: var(--neon); font: 600 10px/1 var(--font-mono); letter-spacing: 0.22em; text-transform: uppercase; }
	nav h6 { margin: 16px 10px 6px; color: var(--chrome-mid); font: 600 10px/1 var(--font-mono); letter-spacing: 0.24em; text-transform: uppercase; }
	nav button {
		all: unset; cursor: pointer; padding: 9px 10px; border-radius: 4px; display: flex; gap: 10px; align-items: center;
		color: var(--dim); font: 600 14px/1 var(--font-display); letter-spacing: 0.06em; text-transform: uppercase;
		transition: color 0.15s, background 0.15s, box-shadow 0.15s;
	}
	nav button svg { width: 18px; height: 18px; flex: none; stroke: currentColor; transition: filter 0.15s; }
	nav button .badge { margin-left: auto; }
	nav button:hover, nav button:focus-visible { color: var(--neon-hot); background: rgba(240, 122, 40, 0.06); }
	nav button:hover svg, nav button:focus-visible svg { filter: drop-shadow(0 0 4px var(--neon)) drop-shadow(0 0 10px var(--neon-glow)); }
	nav button.on { color: var(--text); background: linear-gradient(90deg, rgba(240, 122, 40, 0.16), rgba(240, 122, 40, 0.02)); box-shadow: inset 2px 0 0 var(--neon), -6px 0 16px -6px var(--neon-glow); }
	nav button.on svg { color: var(--neon); filter: drop-shadow(0 0 4px var(--neon-glow)); }
	.badge {
		background: var(--neon); color: #160800; border-radius: 3px; padding: 2px 7px; font: 700 11px/1.2 var(--font-mono);
		box-shadow: 0 0 10px var(--neon-glow);
	}
	.foot {
		margin-top: auto; padding: 12px; color: var(--dim); font: 12px/1.6 var(--font-mono);
		background: rgba(0, 0, 0, 0.35); border: 1px solid var(--seam); clip-path: var(--chamfer);
	}
	.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--neon); margin-right: 8px; box-shadow: 0 0 8px var(--neon); animation: pulse 2s ease-in-out infinite; }
	.dot.off { background: var(--chrome-lo); box-shadow: none; animation: none; }
	@keyframes pulse { 50% { opacity: 0.45; } }

	main { padding-block: 22px 40px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); max-width: 1320px; min-width: 0; }
	.top { display: flex; gap: 10px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }
	.top input {
		flex: 1; min-width: 220px; background: rgba(10, 11, 14, 0.85); border: 1px solid var(--seam); color: var(--text);
		padding: 12px 14px; font: 15px var(--font-body); clip-path: var(--chamfer); outline: none; transition: border-color 0.15s, box-shadow 0.15s;
	}
	.top input:focus { border-color: var(--neon); box-shadow: inset 0 0 0 1px var(--neon), 0 0 18px var(--neon-glow); }
	.btn {
		position: relative; background: linear-gradient(180deg, #23262d, #15171c); border: 1px solid var(--chrome-lo); color: var(--text);
		padding: 9px 14px; cursor: pointer; font: 600 13px/1 var(--font-display); letter-spacing: 0.08em; text-transform: uppercase;
		clip-path: var(--chamfer); transition: color 0.15s, box-shadow 0.15s, border-color 0.15s;
	}
	.btn:hover, .btn:focus-visible { color: var(--neon-hot); border-color: var(--neon); box-shadow: inset 0 0 14px rgba(240, 122, 40, 0.25); outline: none; }
	.btn.primary { background: linear-gradient(180deg, var(--neon-hot), var(--neon) 55%, #c85a12); color: #1a0900; border-color: var(--neon-hot); }
	.btn.primary:hover, .btn.primary:focus-visible { color: #1a0900; box-shadow: 0 0 22px var(--neon-glow); }
	.btn.ok:hover { color: var(--ok); border-color: var(--ok); box-shadow: inset 0 0 14px rgba(61, 220, 132, 0.2); }
	.btn.bad:hover { color: var(--bad); border-color: var(--bad); box-shadow: inset 0 0 14px rgba(255, 77, 94, 0.2); }

	h1 {
		font: 700 24px/1.2 var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 4px; text-wrap: balance;
		background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent;
	}
	.sub { color: var(--dim); margin: 0 0 18px; max-width: 70ch; }
	section + section { margin-top: 28px; }

	.card {
		position: relative; background: linear-gradient(180deg, rgba(28, 31, 37, 0.86), rgba(18, 20, 24, 0.9));
		border: 1px solid var(--seam); padding: 16px; margin-bottom: 12px; clip-path: var(--chamfer);
	}
	/* Chrome top edge on every plate, and a neon seam that lights up on hover. */
	.card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 1px; background: var(--chrome); opacity: 0.6; }
	.card::after { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 2px; background: var(--neon); opacity: 0; box-shadow: 0 0 10px var(--neon); transition: opacity 0.2s; }
	.card:hover::after, .card.alert::after { opacity: 1; }
	.card .k { color: var(--neon); font: 600 11px/1.4 var(--font-mono); letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 4px; }
	.card b { font-weight: 600; }
	.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

	.agent { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 6px; border-bottom: 1px solid var(--seam); }
	.agent:last-child { border-bottom: 0; }
	.av {
		width: 40px; height: 40px; display: grid; place-items: center; background: var(--chrome);
		clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); transition: filter 0.15s;
	}
	.av span { width: 34px; height: 34px; display: grid; place-items: center; background: #0d0e11; clip-path: inherit; font: 700 15px/1 var(--font-display); color: var(--chrome-mid); }
	.agent.working .av span { color: var(--neon); text-shadow: 0 0 8px var(--neon-glow); }
	.agent:hover .av { filter: drop-shadow(0 0 6px var(--neon)) drop-shadow(0 0 14px var(--neon-glow)); }
	.agent b { font: 600 15px/1.2 var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; }
	.agent .muted { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.st { font: 600 10px/1 var(--font-mono); letter-spacing: 0.16em; padding: 4px 8px; border: 1px solid var(--seam); color: var(--dim); background: rgba(0, 0, 0, 0.3); }
	.st.working { color: var(--neon); border-color: var(--neon); box-shadow: 0 0 10px rgba(240, 122, 40, 0.35); }
	.st.needs_you { color: var(--warn); border-color: var(--warn); }
	.st.blocked { color: var(--bad); border-color: var(--bad); }
	.st.done { color: var(--ok); border-color: rgba(61, 220, 132, 0.5); }

	.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
	.tile img, .tile video { display: block; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #000; border: 1px solid var(--seam); }
	.tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
	.tabs button {
		all: unset; cursor: pointer; padding: 7px 12px; font: 600 12px/1 var(--font-display); letter-spacing: 0.08em; text-transform: uppercase;
		color: var(--dim); border: 1px solid var(--seam); background: rgba(0, 0, 0, 0.35); clip-path: var(--chamfer); transition: color 0.15s, border-color 0.15s;
	}
	.tabs button:hover, .tabs button:focus-visible { color: var(--neon-hot); border-color: var(--neon); }
	.tabs button.on { color: #1a0900; background: var(--neon); border-color: var(--neon); box-shadow: 0 0 14px var(--neon-glow); }
	.table-wrap { overflow-x: auto; }
	table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
	td, th { text-align: left; padding: 10px; border-bottom: 1px solid var(--seam); vertical-align: top; }
	th { color: var(--chrome-mid); font: 600 10px/1 var(--font-mono); letter-spacing: 0.2em; text-transform: uppercase; }
	tr:hover td { background: rgba(240, 122, 40, 0.04); }
	textarea {
		width: 100%; background: rgba(0, 0, 0, 0.4); color: var(--text); border: 1px solid var(--seam); padding: 8px 10px; min-height: 52px;
		font: 14px var(--font-body); margin-top: 8px; outline: none; resize: vertical;
	}
	textarea:focus { border-color: var(--neon); box-shadow: 0 0 12px rgba(240, 122, 40, 0.3); }
	.muted { color: var(--dim); }
	.mono { font-family: var(--font-mono); font-size: 12px; }
	pre { white-space: pre-wrap; margin: 6px 0; font: inherit; }
	:focus-visible { outline: 1px solid var(--neon); outline-offset: 2px; }
	@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
	@media (max-width: 760px) {
		.app { grid-template-columns: minmax(0, 1fr); }
		nav { flex-direction: row; flex-wrap: wrap; padding: 12px max(16px, env(safe-area-inset-left, 0px)); }
		nav::after { top: auto; left: 0; width: auto; height: 2px; }
		.brand { width: 100%; margin-bottom: 6px; }
		.foot, nav h6 { display: none; }
		nav button { padding: 8px; }
		main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
	}
	/* Beginner navigation: every nav item carries a one-line plain-English hint. */
	nav button { flex-wrap: wrap; row-gap: 3px; }
	nav button .hint { flex-basis: 100%; padding-left: 28px; color: var(--chrome-lo); font: 500 11px/1.2 var(--font-body); letter-spacing: 0; text-transform: none; }
	nav button.on .hint, nav button:hover .hint { color: var(--dim); }
	.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 10px; }
	.step { background: rgba(0, 0, 0, 0.35); border: 1px solid var(--seam); padding: 12px; clip-path: var(--chamfer); }
	.step .n { font: 700 22px/1 var(--font-display); color: var(--neon); text-shadow: 0 0 10px var(--neon-glow); }
	.step b { display: block; margin: 6px 0 2px; font-family: var(--font-display); letter-spacing: 0.04em; }
	.pagehelp { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; margin: -6px 0 18px; border: 1px dashed var(--seam); color: var(--dim); font-size: 14px; }
	.pagehelp svg { width: 18px; height: 18px; flex: none; stroke: var(--neon); margin-top: 2px; }
	.lib { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start; }
	.lib-list { max-height: calc(100vh - 220px); overflow: auto; }
	.lib-list h6 { margin: 14px 4px 6px; color: var(--chrome-mid); font: 600 10px/1 var(--font-mono); letter-spacing: 0.22em; text-transform: uppercase; }
	.lib-list button { all: unset; display: block; width: 100%; box-sizing: border-box; cursor: pointer; padding: 8px 10px; border-left: 2px solid transparent; color: var(--text); font-size: 14px; }
	.lib-list button:hover, .lib-list button:focus-visible { background: rgba(240, 122, 40, 0.06); color: var(--neon-hot); }
	.lib-list button.on { border-left-color: var(--neon); background: rgba(240, 122, 40, 0.1); }
	.lib-list .new { margin-left: 6px; font: 700 9px/1 var(--font-mono); color: #160800; background: var(--neon); padding: 2px 5px; vertical-align: middle; }
	.doc { line-height: 1.6; }
	.doc h1, .doc h2, .doc h3, .doc h4 { font-family: var(--font-display); letter-spacing: 0.04em; margin: 1.2em 0 0.4em; }
	.doc h1 { font-size: 22px; } .doc h2 { font-size: 18px; color: var(--neon-hot); } .doc h3 { font-size: 16px; } .doc h4 { font-size: 15px; color: var(--chrome-mid); }
	.doc p { margin: 0.5em 0; } .doc ul, .doc ol { margin: 0.4em 0; padding-left: 1.4em; } .doc li { margin: 0.2em 0; }
	.doc code { font: 12.5px var(--font-mono); background: rgba(0, 0, 0, 0.45); padding: 1px 5px; border: 1px solid var(--seam); }
	.doc pre.code { font: 12.5px/1.5 var(--font-mono); background: rgba(0, 0, 0, 0.5); border: 1px solid var(--seam); padding: 10px; overflow-x: auto; white-space: pre; }
	.doc table { margin: 0.6em 0; font-size: 13.5px; } .doc td, .doc th { padding: 6px 8px; }
	.doc a { color: var(--neon-hot); }
	.doc blockquote { margin: 0.6em 0; padding: 4px 12px; border-left: 2px solid var(--neon); color: var(--dim); }
	.glossary dt { font: 600 14px/1.3 var(--font-display); color: var(--neon-hot); letter-spacing: 0.04em; margin-top: 10px; }
	.glossary dd { margin: 2px 0 0; color: var(--text); }
	.pitch-head { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
	.pitch-head b { font: 600 17px/1.25 var(--font-display); letter-spacing: 0.03em; }
	.hook { color: var(--neon-hot); margin: 4px 0 8px; }
	details > summary { cursor: pointer; color: var(--dim); font: 600 12px/1 var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 6px; }
	details[open] > summary { color: var(--neon-hot); }
	input.search { width: 100%; background: rgba(10, 11, 14, 0.85); border: 1px solid var(--seam); color: var(--text); padding: 10px 12px; font: 14px var(--font-body); clip-path: var(--chamfer); outline: none; margin-bottom: 6px; }
	input.search:focus { border-color: var(--neon); }
	.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
	@media (max-width: 900px) { .lib { grid-template-columns: minmax(0, 1fr); } .lib-list { max-height: 320px; } }
</style>
</head>
<body>
<div class="app">
	<nav aria-label="Control room sections">
		<div class="brand"><div class="logo" aria-hidden="true"><span>&Omega;</span></div><div><b>OmegaDev</b><small>Control room</small></div></div>
		<h6>Start here</h6>
		<button data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg>Today <span class="badge" id="b-home" hidden></span><span class="hint">What needs you right now</span></button>
		<button data-view="guide"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/></svg>Guide<span class="hint">How this works, in plain words</span></button>
		<h6>Make games</h6>
		<button data-view="pitches"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Game ideas <span class="badge" id="b-pitches" hidden></span><span class="hint">Pick what the team builds next</span></button>
		<button data-view="games"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true"><path d="M6 8h12a4 4 0 0 1 4 4v2a3 3 0 0 1-5.4 1.8L15 14H9l-1.6 1.8A3 3 0 0 1 2 14v-2a4 4 0 0 1 4-4z"/><path d="M7 11v3M5.5 12.5h3M16 12h.01M18 13.5h.01"/></svg>My games<span class="hint">Every game and how far along it is</span></button>
		<h6>The team</h6>
		<button data-view="team"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14.8c1.6.8 2.6 2.6 3 5.2"/></svg>Who's working<span class="hint">The 14 AI helpers and what each does</span></button>
		<button data-view="tasks"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>Work queue<span class="hint">Every job, in order</span></button>
		<h6>Check work</h6>
		<button data-view="review"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.6"/></svg>Review <span class="badge" id="b-review" hidden></span><span class="hint">Approve or send back what they made</span></button>
		<h6>Learn</h6>
		<button data-view="library"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true"><path d="M4 4h5v16H4zM10 4h5v16h-5z"/><path d="m16 5 4-1 2 15-4 1z"/></svg>Library <span class="badge" id="b-library" hidden></span><span class="hint">Everything the studio has learned</span></button>
		<div class="foot" id="foot"></div>
	</nav>
	<main>
		<div class="top">
			<label for="ask" class="muted" hidden>Message the Lead</label>
			<input id="ask" placeholder="Tell the team what you want, e.g. “find me 4 game ideas” or “build pitch 2”">
			<button class="btn primary" id="askBtn">Send to Lead</button>
			<button class="btn" id="pauseBtn">Pause all</button>
		</div>
		<div id="view"></div>
	</main>
</div>
<script>
let S = null, view = location.hash.slice(1) || "home", reviewFilter = "pending", taskFilter = "open";
let LIB = null, libDoc = null, libQuery = "";
const $ = (s) => document.querySelector(s);
const el = (tag, props = {}, ...kids) => {
	const n = document.createElement(tag);
	for (const [k, v] of Object.entries(props)) {
		if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
	}
	for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : document.createTextNode(String(k)));
	return n;
};
const ago = (iso) => { if (!iso) return ""; const s = (Date.now() - Date.parse(iso)) / 1000; return s < 60 ? "just now" : s < 3600 ? `${Math.round(s/60)}m ago` : s < 86400 ? `${Math.round(s/3600)}h ago` : `${Math.round(s/86400)}d ago`; };
const isNew = (iso) => iso && Date.now() - Date.parse(iso) < 86400000;
const post = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then((r) => r.json());
const go = (v) => { view = v; location.hash = v; render(); window.scrollTo(0, 0); };
const INFO = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>';
const help = (text) => { const d = el("div", { class: "pagehelp" }); d.innerHTML = INFO; d.append(el("div", {}, text)); return d; };
const head = (title, text) => [el("h1", {}, title), help(text)];

// Plain-English roles for the 14 agents (from .claude/agents/*.md).
const ROLES = {
	lead: "The boss. Plans each cycle, hands out jobs and keeps this room up to date.",
	pulse: "Market researcher. Finds what's trending on Roblox and writes game ideas.",
	architect: "Turns the idea you picked into a plan and a step-by-step build guide.",
	builder: "Writes the game's code, one step of the guide at a time.",
	scenic: "Builds the world: zones, lighting, landmarks and paths.",
	frame: "Characters, animations and skill effects.",
	librarian: "Finds sounds, models and images, and records who made them.",
	balance: "Owns the numbers: prices, rewards, odds and how fast you level.",
	splash: "Makes the store page: icon, thumbnails and description.",
	playtest: "Plays the game in Roblox Studio and proves it works with screenshots.",
	"kid-tester": "Plays like an impatient 10-year-old on a phone and reports where it got boring.",
	producer: "Quality gate. Decides what's good enough to ship.",
	liveops: "After launch: events, updates and reading the stats.",
	"code-reviewer": "Checks every code change for bugs, cheats and lost data.",
};
const STATUS_WORDS = { working: "Working", needs_you: "Needs you", queued: "Waiting", blocked: "Stuck", later: "Later", done: "Done", idle: "Idle" };

async function load() {
	try { S = await (await fetch("/api/state")).json(); render(); } catch { $("#foot").textContent = "Disconnected. Is `omega room` running?"; }
}
async function loadLibrary() {
	try { LIB = await (await fetch("/api/library")).json(); } catch { LIB = []; }
	const fresh = LIB.filter((d) => isNew(d.updated)).length;
	$("#b-library").hidden = !fresh; $("#b-library").textContent = fresh;
	if (view === "library") render();
}
function render() {
	if (!S) return;
	if (!VIEWS[view]) view = "home";
	const pending = S.review.filter((r) => r.verdict === "pending").length;
	const openTry = S.tryit.filter((t) => t.status === "open").length;
	const needs = S.tasks.filter((t) => t.status === "needs_you").length + openTry;
	for (const [id, n] of [["#b-home", needs], ["#b-review", pending], ["#b-pitches", S.pitches.length]]) { $(id).hidden = !n; $(id).textContent = n; }
	const working = Object.entries(S.agents).filter(([, a]) => a.status === "working");
	$("#foot").replaceChildren(el("div", {}, el("span", { class: working.length ? "dot" : "dot off" }), `${working.length} helpers working`),
		el("div", {}, S.studioLock ? `Studio in use by ${S.studioLock.agent}` : "Studio: free"), el("div", {}, S.paused ? "PAUSED" : "Running"));
	$("#pauseBtn").textContent = S.paused ? "Resume" : "Pause all";
	document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.view === view));
	// Keep focus inside text boxes from being lost on the 5-second refresh.
	if (document.activeElement && document.activeElement.closest("#view") && /TEXTAREA|INPUT/.test(document.activeElement.tagName)) return;
	$("#view").replaceChildren(VIEWS[view]());
}

const VIEWS = {
	home() {
		const wrap = el("div", {}, ...head("Today", "Start here every time. Anything that needs your answer shows up on this page first."));
		if (!S.games.length || localStorage.getItem("omega-howto") !== "hidden") {
			const hide = el("button", { class: "btn", onclick: () => { localStorage.setItem("omega-howto", "hidden"); render(); } }, "Got it, hide this");
			wrap.append(el("div", { class: "card" }, el("div", { class: "k" }, "How making a game works"),
				el("div", { class: "steps" },
					[["1", "Pick an idea", "Open Game ideas and press “Build this one”."], ["2", "The team builds it", "Run a Lead cycle. Helpers code, build and test on their own."],
					 ["3", "Check their work", "Open Review. Approve it, ask for changes, or reject it."], ["4", "Play and ship", "Try it when asked, then publish from GitHub when it's ready."]]
						.map(([n, t, d]) => el("div", { class: "step" }, el("div", { class: "n" }, n), el("b", {}, t), el("div", { class: "muted" }, d)))),
				S.games.length ? el("div", { class: "row", style: "margin-top:10px" }, hide) : null));
		}
		const todo = [];
		for (const t of S.tasks.filter((t) => t.status === "needs_you")) todo.push(el("div", { class: "card alert" }, el("div", { class: "k" }, `Needs your answer · asked by ${t.agent}`), el("b", {}, `${t.game}: ${t.title}`), t.detail ? el("pre", {}, t.detail) : null));
		for (const c of S.tryit.filter((t) => t.status === "open")) {
			const reply = el("textarea", { placeholder: "What happened? (optional)" });
			todo.push(el("div", { class: "card alert" }, el("div", { class: "k" }, "Please try this in Roblox Studio"), el("b", {}, `${c.game}: ${c.title}`), el("pre", {}, c.steps), reply,
				el("div", { class: "row" }, el("button", { class: "btn ok", onclick: async () => { await post("/api/tryit", { id: c.id, reply: reply.value }); load(); } }, "I tried it"))));
		}
		const pending = S.review.filter((r) => r.verdict === "pending").length;
		if (pending) todo.push(el("div", { class: "card alert" }, el("div", { class: "k" }, "Waiting for your verdict"), el("b", {}, `${pending} thing${pending > 1 ? "s" : ""} to review`), " ", el("button", { class: "btn", onclick: () => go("review") }, "Open Review")));
		if (S.pitches.length) todo.push(el("div", { class: "card" }, el("div", { class: "k" }, "Pick the next game"), `${S.pitches.length} game ideas are waiting. `, el("button", { class: "btn", onclick: () => go("pitches") }, "See the ideas")));
		wrap.append(el("h1", { style: "margin-top:8px" }, "Your to-do"), todo.length ? todo : el("p", { class: "muted" }, "Nothing needs you. The team will ask here when it does."));
		wrap.append(el("h1", { style: "margin-top:20px" }, "Working right now"));
		const live = Object.entries(S.agents).filter(([, a]) => a.status === "working");
		wrap.append(live.length ? el("div", { class: "card" }, live.map(agentRow)) : el("p", { class: "muted" }, "Nobody is working. Start a cycle with ", el("code", { class: "mono" }, "node scripts/omega.mjs lead")));
		wrap.append(el("h1", { style: "margin-top:20px" }, "Your games"), gamesTable());
		return wrap;
	},
	guide() {
		const wrap = el("div", {}, ...head("Guide", "Everything on this site, explained for someone brand new."));
		const pages = [
			["Today", "Your to-do list. If a helper needs an answer, a test, or a verdict, it appears here."],
			["Game ideas", "Pitches written by Pulse after researching what's popular. Press “Build this one” to start a game."],
			["My games", "Each game and its stage: idea, spec, build, polish, ship."],
			["Who's working", "The 14 AI helpers, what each one is for, and what they're doing now."],
			["Work queue", "Every job the Lead has handed out, with its status."],
			["Review", "Screenshots, clips, UI and documents the helpers made. Your verdict decides what happens next."],
			["Library", "The studio's knowledge: the playbook chapters, research reports and rulebooks. Helpers read these before working, and so can you."],
		];
		wrap.append(el("div", { class: "card" }, el("div", { class: "k" }, "The pages"), el("dl", { class: "glossary" }, pages.map(([t, d]) => [el("dt", {}, t), el("dd", {}, d)]))));
		const words = [
			["Lead", "The main AI helper. It reads this room, decides the next jobs and hands them out."],
			["Cycle", "One round of work by the Lead and the helpers it calls. Start one with the command below."],
			["Pitch", "A one-page game idea with the loop, references, money plan and risks."],
			["Verdict", "Your answer on a piece of work: Approve, Changes (say what), or Reject."],
			["Studio lock", "Only one helper can use Roblox Studio at a time. The bottom-left box shows who has it."],
			["Playtest", "Pressing Play in Roblox Studio to prove the game works, with screenshots as evidence."],
			["Pause all", "Stops every helper after its current step. Press again to resume."],
		];
		wrap.append(el("div", { class: "card" }, el("div", { class: "k" }, "Words you'll see"), el("dl", { class: "glossary" }, words.map(([t, d]) => [el("dt", {}, t), el("dd", {}, d)]))));
		const cmds = [["Open this room", "node scripts/omega.mjs room"], ["Run one cycle", "node scripts/omega.mjs lead"], ["Keep going overnight", "node scripts/omega.mjs lead --cycles 20"], ["Pause everything", "node scripts/omega.mjs pause"]];
		wrap.append(el("div", { class: "card" }, el("div", { class: "k" }, "Commands (run in the OmegaDev folder)"),
			el("div", { class: "table-wrap" }, el("table", {}, cmds.map(([a, c]) => el("tr", {}, el("td", {}, a), el("td", {}, el("code", { class: "mono" }, c))))))));
		wrap.append(el("div", { class: "card" }, el("div", { class: "k" }, "Want to learn more?"), "The Library has the full playbook. Start with ", el("button", { class: "btn", onclick: () => openDoc("vault/00 Start Here.md") }, "00 Start Here")));
		return wrap;
	},
	team() {
		const list = Object.entries(S.agents).sort((a, b) => (a[1].status === "working" ? -1 : 0) - (b[1].status === "working" ? -1 : 0));
		const n = list.filter(([, a]) => a.status === "working").length;
		return el("div", {}, ...head("Who's working", `${n} of 14 helpers are working now. Each one has a single job; the Lead decides who goes next.`),
			el("div", { class: "card" }, list.map(([name, a]) => agentRow([name, a], true))));
	},
	tasks() {
		const order = ["needs_you", "working", "queued", "blocked", "later", "done"];
		const filters = [["open", "Open"], ["needs_you", "Needs you"], ["working", "Working"], ["blocked", "Stuck"], ["done", "Done"], ["all", "All"]];
		const keep = (t) => taskFilter === "all" || (taskFilter === "open" ? t.status !== "done" : t.status === taskFilter);
		const rows = [...S.tasks].filter(keep).sort((a, b) => order.indexOf(a.status) - order.indexOf(b.status) || b.updated.localeCompare(a.updated));
		const chips = el("div", { class: "tabs" }, filters.map(([v, label]) => el("button", { class: taskFilter === v ? "on" : "", onclick: () => { taskFilter = v; render(); } }, `${label} ${S.tasks.filter((t) => v === "all" || (v === "open" ? t.status !== "done" : t.status === v)).length}`)));
		return el("div", {}, ...head("Work queue", "Every job the Lead has handed out. “Needs you” jobs also show on Today."), chips,
			rows.length ? el("div", { class: "table-wrap" }, el("table", {}, el("tr", {}, ["Status", "Helper", "Game", "Job", "Updated"].map((h) => el("th", {}, h))),
				rows.map((t) => el("tr", {}, el("td", {}, el("span", { class: `st ${t.status}` }, STATUS_WORDS[t.status] || t.status)), el("td", {}, t.agent), el("td", {}, t.game), el("td", {}, t.title, t.detail ? el("div", { class: "muted" }, t.detail) : null), el("td", { class: "muted mono" }, ago(t.updated))))))
				: el("p", { class: "muted" }, "No jobs here."));
	},
	review() {
		const counts = (v) => S.review.filter((r) => v === "all" || r.verdict === v).length;
		const tabs = el("div", { class: "tabs" }, [["pending", "To review"], ["changes", "Changes asked"], ["approved", "Approved"], ["rejected", "Rejected"], ["all", "Everything"]]
			.map(([v, label]) => el("button", { class: reviewFilter === v ? "on" : "", onclick: () => { reviewFilter = v; render(); } }, `${label} ${counts(v)}`)));
		const items = S.review.filter((r) => reviewFilter === "all" || r.verdict === reviewFilter).sort((a, b) => b.created.localeCompare(a.created));
		return el("div", {}, ...head("Review", "Look at what a helper made, then press Approve, Changes (type what to change) or Reject. The helper picks up your answer on its next cycle."), tabs,
			items.length ? el("div", { class: "grid" }, items.map(reviewTile)) : el("p", { class: "muted" }, "All caught up."));
	},
	games() {
		return el("div", {}, ...head("My games", "Every game the studio is making. Stages go idea → spec → build → polish → ship."), gamesTable());
	},
	pitches() {
		const wrap = el("div", {}, ...head("Game ideas", "Each card is one pitch. Read the hook, open the details if it sounds fun, then press “Build this one” to tell the Lead."));
		if (!S.pitches.length) wrap.append(el("p", { class: "muted" }, "No ideas yet. Type “find me 4 game ideas” in the box above and run a cycle."));
		S.pitches.forEach((p, i) => {
			const title = el("b", {}, p.replace(/\.md$/, "")), hook = el("div", { class: "hook" }), body = el("div", { class: "doc" }, "Loading…");
			fetch(`/pitch/${encodeURIComponent(p)}`).then((r) => r.text()).then((t) => {
				const h = t.match(/^#\s+(.+)$/m); if (h) title.textContent = h[1];
				const k = t.match(/\*\*One sentence[^*]*\*\*\s*(.+)/i) || t.match(/^>\s*(.+)$/m); if (k) hook.textContent = k[1];
				body.replaceChildren(md(t.replace(/^#\s+.+$/m, "")));
			});
			const build = el("button", { class: "btn primary", onclick: async (e) => { await post("/api/ask", { text: `build pitch ${i + 1} (${p})` }); e.target.textContent = "Sent to the Lead"; e.target.disabled = true; } }, "Build this one");
			wrap.append(el("div", { class: "card" }, el("div", { class: "pitch-head" }, el("div", {}, el("div", { class: "k" }, `Idea ${i + 1}`), title), build), hook,
				el("details", {}, el("summary", {}, "Read the full pitch"), body)));
		});
		return wrap;
	},
	library() {
		const wrap = el("div", {}, ...head("Library", "Everything the studio has learned. The helpers follow these files when they work. Search, or pick a group on the left."));
		if (!LIB) { loadLibrary(); return wrap.appendChild(el("p", { class: "muted" }, "Loading…")) && wrap; }
		const q = libQuery.trim().toLowerCase();
		const hits = LIB.filter((d) => !q || d.title.toLowerCase().includes(q) || d.text.toLowerCase().includes(q));
		const search = el("input", { class: "search", placeholder: "Search the library (e.g. lava, odds, mobile, animation)", value: libQuery });
		search.addEventListener("input", () => { libQuery = search.value; const pos = search.selectionStart; render(); const s = $("input.search"); if (s) { s.focus(); s.setSelectionRange(pos, pos); } });
		const list = el("div", { class: "card lib-list" }, search);
		const groups = [...new Set(LIB.map((d) => d.group))];
		for (const g of groups) {
			const docs = hits.filter((d) => d.group === g);
			if (!docs.length) continue;
			list.append(el("h6", {}, `${g} · ${docs.length}`));
			for (const d of docs) list.append(el("button", { class: libDoc === d.path ? "on" : "", onclick: () => openDoc(d.path) }, d.title, isNew(d.updated) ? el("span", { class: "new" }, "NEW") : null));
		}
		if (!hits.length) list.append(el("p", { class: "muted" }, "Nothing matches."));
		const cur = LIB.find((d) => d.path === libDoc) || hits[0] || LIB[0];
		const reader = el("div", { class: "card" });
		if (cur) {
			libDoc = cur.path;
			reader.append(el("div", { class: "k" }, `${cur.group} · ${cur.path} · updated ${ago(cur.updated)}`), el("div", { class: "doc" }, md(cur.text)));
		}
		wrap.append(el("div", { class: "lib" }, list, reader));
		return wrap;
	},
};
function openDoc(p) { libDoc = p; go("library"); }

function agentRow([name, a], withRole) {
	return el("div", { class: `agent ${a.status}` }, el("div", { class: "av" }, el("span", {}, name[0].toUpperCase())),
		el("div", {}, el("b", {}, name), withRole ? el("div", { class: "muted" }, ROLES[name] || "") : null,
			el("div", { class: withRole ? "mono" : "muted" }, a.game ? `On ${a.game}: ${a.line}` : a.line || (withRole ? "" : "—"))),
		el("div", { style: "text-align:right" }, el("span", { class: `st ${a.status}` }, (STATUS_WORDS[a.status] || a.status).toUpperCase()), el("div", { class: "muted" }, ago(a.updated))));
}
function gamesTable() {
	if (!S.games.length) return el("p", { class: "muted" }, "No games yet. Pick one in Game ideas to start.");
	return el("div", { class: "table-wrap" }, el("table", {}, el("tr", {}, ["Game", "Stage", "Version", "Open jobs"].map((h) => el("th", {}, h))),
		S.games.map((g) => el("tr", {}, el("td", {}, el("b", {}, g.name || g.slug), el("div", { class: "muted" }, g.slug)), el("td", {}, g.stage || "?"), el("td", {}, g.version ?? "—"),
			el("td", {}, S.tasks.filter((t) => t.game === g.slug && t.status !== "done").length)))));
}
function reviewTile(r) {
	const media = r.file ? (/\.(mp4|webm)$/.test(r.file) ? el("video", { src: `/${r.file}`, controls: "" }) : el("img", { src: `/${r.file}`, alt: r.title })) : null;
	const comment = el("textarea", { placeholder: "What should change? (needed for Changes)" });
	comment.value = r.comment || "";
	const act = (verdict) => async () => {
		if (verdict === "changes" && !comment.value.trim()) { comment.focus(); return; }
		await post("/api/verdict", { id: r.id, verdict, comment: comment.value }); load();
	};
	const doc = r.doc && LIB ? LIB.find((d) => d.path === r.doc) : null;
	return el("div", { class: "card tile" }, media, el("div", { class: "k", style: "margin-top:8px" }, `${r.kind} · ${r.agent} · ${r.game}`), el("b", {}, r.title),
		r.note ? el("pre", { class: "muted" }, r.note) : null, r.doc ? el("button", { class: "btn", onclick: () => openDoc(r.doc) }, doc ? "Read it in the Library" : "Open in Library") : null,
		el("div", { class: "muted" }, `${r.verdict} · ${ago(r.updated)}`), comment,
		el("div", { class: "row", style: "margin-top:6px" }, el("button", { class: "btn ok", onclick: act("approved") }, "Approve"), el("button", { class: "btn warn", onclick: act("changes") }, "Changes"), el("button", { class: "btn bad", onclick: act("rejected") }, "Reject")));
}

// Small, safe Markdown renderer (text nodes only; links limited to http/https).
function md(src) {
	const root = document.createDocumentFragment();
	const inline = (text) => {
		const out = document.createDocumentFragment();
		const re = /(\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\((https?:\/\/[^)\s]+)\)|https?:\/\/[^\s)<>]+)/g;
		let last = 0, m;
		while ((m = re.exec(text))) {
			if (m.index > last) out.append(text.slice(last, m.index));
			const t = m[0];
			if (t.startsWith("**")) out.append(el("b", {}, t.slice(2, -2)));
			else if (t.startsWith("`")) out.append(el("code", {}, t.slice(1, -1)));
			else if (t.startsWith("[")) out.append(el("a", { href: m[2], target: "_blank", rel: "noopener noreferrer" }, t.slice(1, t.indexOf("]"))));
			else out.append(el("a", { href: t, target: "_blank", rel: "noopener noreferrer" }, t));
			last = m.index + t.length;
		}
		if (last < text.length) out.append(text.slice(last));
		return out;
	};
	const lines = src.replace(/\r/g, "").split("\n");
	let i = 0;
	while (i < lines.length) {
		const line = lines[i];
		if (/^```/.test(line)) { const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; root.append(el("pre", { class: "code" }, buf.join("\n"))); continue; }
		const h = line.match(/^(#{1,4})\s+(.*)$/); if (h) { root.append(el(`h${h[1].length}`, {}, inline(h[2]))); i++; continue; }
		if (/^\s*\|/.test(line)) {
			const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
			const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
			const body = rows.filter((r) => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
			const table = el("table", {}, body.map((r, k) => el("tr", {}, cells(r).map((c) => el(k === 0 ? "th" : "td", {}, inline(c))))));
			root.append(el("div", { class: "table-wrap" }, table)); continue;
		}
		if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
			const ordered = /^\s*\d+\./.test(line); const list = el(ordered ? "ol" : "ul");
			while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) { list.append(el("li", {}, inline(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, "")))); i++; }
			root.append(list); continue;
		}
		if (/^>\s?/.test(line)) { root.append(el("blockquote", {}, inline(line.replace(/^>\s?/, "")))); i++; continue; }
		if (!line.trim()) { i++; continue; }
		const para = []; while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|\s*\||\s*([-*]|\d+\.)\s|>)/.test(lines[i])) para.push(lines[i++]);
		root.append(el("p", {}, inline(para.join(" "))));
	}
	return root;
}

document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => go(b.dataset.view)));
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (v && v !== view && VIEWS[v]) { view = v; render(); } });
$("#askBtn").addEventListener("click", async () => { const t = $("#ask").value.trim(); if (!t) return; await post("/api/ask", { text: t }); $("#ask").value = ""; $("#ask").placeholder = "Sent. The Lead reads it on its next cycle."; });
$("#ask").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#askBtn").click(); });
$("#pauseBtn").addEventListener("click", async () => { await post("/api/pause", { paused: !S.paused }); load(); });
load(); loadLibrary(); setInterval(load, 5000); setInterval(loadLibrary, 60000);
</script>
</body>
