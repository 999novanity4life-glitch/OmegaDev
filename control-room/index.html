<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmegaDev Control Room</title>
<style>
	:root {
		--bg: #0b0b12; --panel: #14141f; --panel2: #1b1b29; --line: #2a2a3d;
		--text: #ececf4; --dim: #9a9ab3; --accent: #a855f7; --accent2: #ec4899;
		--ok: #22c55e; --warn: #f59e0b; --bad: #ef4444;
	}
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
	.app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
	nav { background: var(--panel); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
	.brand { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
	.logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
	.brand b { display: block; } .brand small { color: var(--dim); }
	nav h6 { margin: 14px 8px 4px; color: var(--dim); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
	nav button { all: unset; cursor: pointer; padding: 7px 10px; border-radius: 8px; display: flex; justify-content: space-between; }
	nav button:hover { background: var(--panel2); } nav button.on { background: #2a1f45; color: #fff; }
	.badge { background: var(--warn); color: #000; border-radius: 99px; padding: 0 7px; font-size: 12px; font-weight: 600; }
	.foot { margin-top: auto; padding: 10px; border: 1px solid var(--line); border-radius: 10px; color: var(--dim); font-size: 12px; }
	.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
	main { padding: 20px 28px; max-width: 1280px; }
	.top { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
	.top input { flex: 1; min-width: 240px; background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 10px 12px; border-radius: 10px; }
	.btn { background: var(--panel2); border: 1px solid var(--line); color: var(--text); padding: 8px 12px; border-radius: 10px; cursor: pointer; }
	.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: 0; }
	.btn.ok { border-color: var(--ok); } .btn.bad { border-color: var(--bad); } .btn.warn { border-color: var(--warn); }
	h1 { font-size: 22px; margin: 0 0 4px; } .sub { color: var(--dim); margin: 0 0 16px; }
	.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
	.card .k { color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
	.row { display: flex; gap: 10px; align-items: center; }
	.agent { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 10px; border-bottom: 1px solid var(--line); }
	.av { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; color: #000; }
	.st { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--panel2); color: var(--dim); }
	.st.working { background: #12351f; color: var(--ok); }
	.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
	.tile img, .tile video { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; background: #000; }
	.tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
	.tabs button { all: unset; cursor: pointer; padding: 5px 10px; border-radius: 8px; background: var(--panel2); color: var(--dim); }
	.tabs button.on { background: #2a1f45; color: #fff; }
	table { width: 100%; border-collapse: collapse; } td, th { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
	th { color: var(--dim); font-weight: 500; }
	textarea { width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-height: 52px; }
	.muted { color: var(--dim); } pre { white-space: pre-wrap; margin: 6px 0; font: inherit; }
	@media (max-width: 760px) { .app { grid-template-columns: 1fr; } nav { flex-direction: row; flex-wrap: wrap; } .foot, nav h6 { display: none; } main { padding: 16px; } }
</style>
</head>
<body>
<div class="app">
	<nav>
		<div class="brand"><div class="logo"></div><div><b>OmegaDev</b><small>control room</small></div></div>
		<h6>Workspace</h6>
		<button data-view="home">Home <span class="badge" id="b-home" hidden></span></button>
		<button data-view="team">Team</button>
		<button data-view="tasks">Tasks</button>
		<button data-view="review">Review <span class="badge" id="b-review" hidden></span></button>
		<h6>Studio</h6>
		<button data-view="games">Games</button>
		<button data-view="pitches">Pitches</button>
		<div class="foot" id="foot"></div>
	</nav>
	<main>
		<div class="top">
			<input id="ask" placeholder="Ask the Lead anything, or say what you want done…">
			<button class="btn primary" id="askBtn">Ask →</button>
			<button class="btn" id="pauseBtn">Pause all</button>
		</div>
		<div id="view"></div>
	</main>
</div>
<script>
const COLORS = { lead:"#e879f9", pulse:"#f472b6", architect:"#93c5fd", builder:"#22d3ee", scenic:"#fbbf24", frame:"#f9a8d4", librarian:"#38bdf8", balance:"#a3e635", splash:"#facc15", playtest:"#4ade80", "kid-tester":"#bef264", producer:"#c4b5fd", liveops:"#2dd4bf", "code-reviewer":"#fb7185" };
let S = null, view = "home", reviewFilter = "pending";
const $ = (s) => document.querySelector(s);
const el = (tag, props = {}, ...kids) => {
	const n = document.createElement(tag);
	for (const [k, v] of Object.entries(props)) {
		if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
	}
	for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : document.createTextNode(String(k)));
	return n;
};
const ago = (iso) => { if (!iso) return ""; const s = (Date.now() - Date.parse(iso)) / 1000; return s < 60 ? "just now" : s < 3600 ? `${Math.round(s/60)}m ago` : s < 86400 ? `${Math.round(s/3600)}h ago` : `${Math.round(s/86400)}d ago`; };
const post = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then((r) => r.json());

async function load() {
	try { S = await (await fetch("/api/state")).json(); render(); } catch { $("#foot").textContent = "Disconnected. Is `omega room` running?"; }
}
function render() {
	const pending = S.review.filter((r) => r.verdict === "pending").length;
	const openTry = S.tryit.filter((t) => t.status === "open").length;
	const needs = S.tasks.filter((t) => t.status === "needs_you").length + openTry + (S.pitches.length ? 1 : 0);
	for (const [id, n] of [["#b-home", needs], ["#b-review", pending]]) { $(id).hidden = !n; $(id).textContent = n; }
	const working = Object.entries(S.agents).filter(([, a]) => a.status === "working");
	$("#foot").replaceChildren(el("div", {}, el("span", { class: "dot", style: working.length ? "" : "background:#555" }), `${working.length} agents working`),
		el("div", {}, S.studioLock ? `Studio: ${S.studioLock.agent}` : "Studio: free"), el("div", {}, S.paused ? "PAUSED" : "Running"));
	$("#pauseBtn").textContent = S.paused ? "Resume" : "Pause all";
	document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.view === view));
	$("#view").replaceChildren(VIEWS[view]());
}
const VIEWS = {
	home() {
		const wrap = el("div", {}, el("h1", {}, "Home"), el("p", { class: "sub" }, "What needs you, and what the team is doing right now."));
		if (S.pitches.length) wrap.append(el("div", { class: "card" }, el("div", { class: "k" }, "Pick the next game"), `${S.pitches.length} pitches from Pulse are waiting for your pick. `, el("button", { class: "btn", onclick: () => { view = "pitches"; render(); } }, "See the pitches")));
		for (const t of S.tasks.filter((t) => t.status === "needs_you")) wrap.append(el("div", { class: "card" }, el("div", { class: "k" }, `Needs you · ${t.agent}`), el("b", {}, `${t.game}: ${t.title}`), el("pre", {}, t.detail)));
		for (const c of S.tryit.filter((t) => t.status === "open")) {
			const reply = el("textarea", { placeholder: "What happened? (optional)" });
			wrap.append(el("div", { class: "card" }, el("div", { class: "k" }, "Try it"), el("b", {}, `${c.game}: ${c.title}`), el("pre", {}, c.steps), reply,
				el("div", { class: "row" }, el("button", { class: "btn ok", onclick: async () => { await post("/api/tryit", { id: c.id, reply: reply.value }); load(); } }, "Done"))));
		}
		wrap.append(el("h1", { style: "margin-top:20px" }, "Live now"));
		const live = Object.entries(S.agents).filter(([, a]) => a.status === "working");
		wrap.append(live.length ? el("div", { class: "card" }, live.map(agentRow)) : el("p", { class: "muted" }, "Nobody is working. Run `node scripts/omega.mjs lead` to start a cycle."));
		wrap.append(el("h1", { style: "margin-top:20px" }, "Where each game is"), gamesTable());
		return wrap;
	},
	team() {
		const list = Object.entries(S.agents);
		const n = list.filter(([, a]) => a.status === "working").length;
		return el("div", {}, el("h1", {}, "Team"), el("p", { class: "sub" }, `${n} working · ${S.tasks.filter((t) => t.status === "needs_you").length} need you`), el("div", { class: "card" }, list.map(agentRow)));
	},
	tasks() {
		const order = ["needs_you", "working", "queued", "blocked", "later", "done"];
		const rows = [...S.tasks].sort((a, b) => order.indexOf(a.status) - order.indexOf(b.status) || b.updated.localeCompare(a.updated));
		return el("div", {}, el("h1", {}, "Tasks"), el("p", { class: "sub" }, "Everything the Lead has queued."),
			el("table", {}, el("tr", {}, ["Status", "Agent", "Game", "Task", "Updated"].map((h) => el("th", {}, h))),
				rows.map((t) => el("tr", {}, el("td", {}, el("span", { class: `st ${t.status === "working" ? "working" : ""}` }, t.status)), el("td", {}, t.agent), el("td", {}, t.game), el("td", {}, t.title, t.detail ? el("div", { class: "muted" }, t.detail) : null), el("td", { class: "muted" }, ago(t.updated))))));
	},
	review() {
		const counts = (v) => S.review.filter((r) => v === "all" || r.verdict === v).length;
		const tabs = el("div", { class: "tabs" }, [["pending", "To review"], ["changes", "Changes asked"], ["approved", "Approved"], ["rejected", "Rejected"], ["all", "Everything"]]
			.map(([v, label]) => el("button", { class: reviewFilter === v ? "on" : "", onclick: () => { reviewFilter = v; render(); } }, `${label} ${counts(v)}`)));
		const items = S.review.filter((r) => reviewFilter === "all" || r.verdict === reviewFilter).sort((a, b) => b.created.localeCompare(a.created));
		return el("div", {}, el("h1", {}, "Review"), el("p", { class: "sub" }, "Everything the agents made for you to look at. Approve it, ask for changes, or reject it; the agent picks up your verdict on its next pass."), tabs,
			items.length ? el("div", { class: "grid" }, items.map(reviewTile)) : el("p", { class: "muted" }, "All caught up."));
	},
	games() { return el("div", {}, el("h1", {}, "Games"), gamesTable()); },
	pitches() {
		const wrap = el("div", {}, el("h1", {}, "Pitches"), el("p", { class: "sub" }, "Pick one by telling the Lead, e.g. “build pitch 2”."));
		for (const p of S.pitches) {
			const body = el("pre", { class: "muted" }, "Loading…");
			fetch(`/pitch/${encodeURIComponent(p)}`).then((r) => r.text()).then((t) => (body.textContent = t));
			wrap.append(el("div", { class: "card" }, el("div", { class: "k" }, p), body));
		}
		return wrap;
	},
};
function agentRow([name, a]) {
	return el("div", { class: "agent" }, el("div", { class: "av", style: `background:${COLORS[name] || "#888"}` }, name[0].toUpperCase()),
		el("div", {}, el("b", {}, name), el("div", { class: "muted" }, a.game ? `On: ${a.game} · ${a.line}` : a.line || "—")),
		el("div", { style: "text-align:right" }, el("span", { class: `st ${a.status}` }, a.status.toUpperCase()), el("div", { class: "muted" }, ago(a.updated))));
}
function gamesTable() {
	if (!S.games.length) return el("p", { class: "muted" }, "No games yet. `node scripts/omega.mjs new-game <slug>`");
	return el("table", {}, el("tr", {}, ["Game", "Stage", "Version", "Open tasks"].map((h) => el("th", {}, h))),
		S.games.map((g) => el("tr", {}, el("td", {}, el("b", {}, g.name || g.slug), el("div", { class: "muted" }, g.slug)), el("td", {}, g.stage || "?"), el("td", {}, g.version ?? "—"),
			el("td", {}, S.tasks.filter((t) => t.game === g.slug && t.status !== "done").length))));
}
function reviewTile(r) {
	const media = r.file ? (/\.(mp4|webm)$/.test(r.file) ? el("video", { src: `/${r.file}`, controls: "" }) : el("img", { src: `/${r.file}`, alt: r.title })) : null;
	const comment = el("textarea", { placeholder: "What should change? (needed for Changes)" });
	comment.value = r.comment || "";
	const act = (verdict) => async () => {
		if (verdict === "changes" && !comment.value.trim()) { comment.focus(); return; }
		await post("/api/verdict", { id: r.id, verdict, comment: comment.value }); load();
	};
	return el("div", { class: "card tile" }, media, el("div", { class: "k", style: "margin-top:8px" }, `${r.kind} · ${r.agent} · ${r.game}`), el("b", {}, r.title),
		r.note ? el("pre", { class: "muted" }, r.note) : null, el("div", { class: "muted" }, `${r.verdict} · ${ago(r.updated)}`), comment,
		el("div", { class: "row", style: "margin-top:6px" }, el("button", { class: "btn ok", onclick: act("approved") }, "Approve"), el("button", { class: "btn warn", onclick: act("changes") }, "Changes"), el("button", { class: "btn bad", onclick: act("rejected") }, "Reject")));
}
document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => { view = b.dataset.view; render(); }));
$("#askBtn").addEventListener("click", async () => { const t = $("#ask").value.trim(); if (!t) return; await post("/api/ask", { text: t }); $("#ask").value = ""; $("#ask").placeholder = "Sent. The Lead reads it on its next cycle."; });
$("#ask").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#askBtn").click(); });
$("#pauseBtn").addEventListener("click", async () => { await post("/api/pause", { paused: !S.paused }); load(); });
load(); setInterval(load, 5000);
</script>
</body>
</html>
